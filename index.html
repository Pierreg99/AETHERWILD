<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AETHERWILD</title>
  <link rel="icon" href="./favicon.svg" />
  <style>
    html, body { margin: 0; height: 100%; background: #07080c; color: #f4efe4; }
    #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
    #live {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="480" height="360" tabindex="0" aria-label="AETHERWILD play field"></canvas>
  </div>
  <div id="live" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
